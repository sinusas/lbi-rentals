<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBI Summer 2027</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f7f4ee; --panel: #ffffff; --ink: #1f2a33; --muted: #6b7680; --line: #e3ddd2;
    --a: #e0703a; --b: #2f7fc1; --ok: #2e8b57; --no: #c0392b; --unk: #9aa3ab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  /* desktop: header on top, map + list fill the rest of the window */
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
  /* own positioning + stacking context: Leaflet's controls and panes stay inside the map box */
  #map { position: relative; z-index: 0; height: 100%; min-width: 0; }
  aside { min-width: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px 40px; }
  @media (max-width: 800px) {
    html, body { height: auto; }
    body { display: block; }
    header { padding: 10px 16px; }
    header h1 { font-size: 17px; }
    main { display: block; height: auto; }
    /* map stays pinned at the top while the list scrolls underneath */
    #map { position: sticky; top: 0; z-index: 500; height: 42vh; height: 42svh; border-bottom: 1px solid var(--line); }
    aside { border-left: 0; overflow: visible; padding: 12px 16px 60px; }
    .house, section { scroll-margin-top: calc(42svh + 8px); }
    .links a { display: inline-block; padding: 6px 0; }
    .jump a { padding: 6px 12px; }
  }
  h2 { font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; }
  section h2:first-child { margin-top: 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
  .house { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .house:hover { border-color: #bdb5a6; }
  .house.sel { outline: 2px solid var(--ink); }
  .house .addr { font-weight: 600; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13.5px; margin-top: 6px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .tbd { color: var(--unk); font-style: italic; }
  .avail-yes { color: var(--ok); font-weight: 600; }
  .avail-no { color: var(--no); font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .links a { font-size: 13px; margin-right: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr.pair { cursor: pointer; }
  tr.pair:hover td { background: #f3efe6; }
  .num { text-align: right; white-space: nowrap; }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); display: grid; place-items: center; }
  .pin span { transform: rotate(45deg); color: #fff; font: 700 12px system-ui; }
  .leaflet-tooltip.lbl { font-weight: 600; }
  .house.booked .addr span:not(.avail-no), .house.booked dl { text-decoration: line-through; opacity: .5; }
  .house.booked { background: #f3f0ea; }
  .house .addr { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .house .addr input { width: 17px; height: 17px; margin: 0; accent-color: var(--ink); }
  .pin.booked { opacity: .45; filter: grayscale(.6); }
  .poi { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .pois { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
  .summary { background: #f3efe6; border-radius: 10px; padding: 10px 12px; margin: 4px 0 8px; font-size: 13px; overflow-x: auto; }
  .jump { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; font-size: 13.5px; }
  .jump a { padding: 4px 10px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600; }
  .summary.empty { color: var(--muted); }
  .summary .count { margin-bottom: 6px; }
  .summary .warn { color: var(--no); font-weight: 600; }
  .stats { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat { flex: 1; background: var(--panel); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .summary table { margin-top: 6px; }
  .summary .sub { color: var(--muted); font-size: 11.5px; }
  details { margin: 4px 0 10px; font-size: 13px; }
  td.route { cursor: pointer; }
  .poi-table tr.split td { border-bottom: 2px solid #d8cfbd; }
  .poi-table td, .poi-table th { white-space: nowrap; }
  .poi-table td:first-child { white-space: normal; }
  td.route:hover { background: #fff3c4; }
  details summary { cursor: pointer; color: var(--muted); }
  tr.pair.booked td { text-decoration: line-through; opacity: .5; }
  .leaflet-tooltip.walk { background: rgba(31,42,51,.85); color: #fff; border: 0; font-weight: 600; box-shadow: none; }
  .leaflet-tooltip.walk::before { display: none; }
  .fb-intro { background: #fff6dc; border: 1px solid #f0dca0; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 13.5px; }
  .fb-intro label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .fb-intro input { flex: 1; min-width: 0; font: inherit; font-weight: 400; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
  .fb-intro input.need { border-color: var(--no); box-shadow: 0 0 0 2px #f5c2bb; }
  .fb-intro .sub { margin-top: 6px; }
  .fb { margin-top: 8px; font-size: 13px; }
  .fb-opt { margin: -2px 0 10px; }
  .fb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .fb-bar button, .fb-post { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 5px 11px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; min-height: 32px; }
  .fb-bar button span { color: var(--muted); }
  .fb-vote.on { background: #e6f4ea; border-color: #9fd3b0; }
  .fb-vote.on span { color: var(--ok); font-weight: 600; }
  .fb-who { color: var(--muted); font-size: 12px; }
  .fb-panel { margin-top: 8px; display: grid; gap: 6px; }
  .fb-c { background: #f6f3ec; border-radius: 8px; padding: 6px 9px; overflow-wrap: anywhere; }
  .fb-panel textarea { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .fb-post { justify-self: start; background: var(--ink); color: #fff; border-color: var(--ink); }
  .sub { color: var(--muted); font-size: 12px; }
  .warn { color: var(--no); }
  .suggest { display: grid; gap: 3px; text-decoration: none; color: var(--ink); background: #e9f2fb; border: 1px solid #b9d4ef;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 13.5px; }
  .suggest span { color: var(--muted); }
  .suggest .go { color: var(--b); font-weight: 600; margin-top: 2px; }
  .suggest:hover { border-color: var(--b); }
  .ai-link { margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ai-link a { color: var(--muted); }
</style>
</head>

  const m = r ? r.m : meters(a, b) * 1.3;
  const ft = m * 3.281;
  return { ft: Math.round(ft / 10) * 10, mi: ft / 5280, m,
           min: r ? r.min : Math.max(1, Math.round(m / 80)),
           path: r ? r.path : [[a.lat, a.lng], [b.lat, b.lng]],
           bike: r && r.bike, drive: r && r.drive, estimate: !r };
}
const distLabel = w => w.m < 30 ? "across the street" : w.mi < 0.25 ? `${w.ft} ft` : `${w.mi.toFixed(1)} mi`;
const walkLabel = w => (w.estimate ? "~" : "") + `🚶 ${w.min} min` + (w.bike ? ` · 🚲 ${w.bike.min} min` : "") + (w.drive ? ` · 🚗 ${w.drive.min} min` : "");
function combos(arr, n) {
  if (n === 0) return [[]];
  return arr.flatMap((x, i) => combos(arr.slice(i + 1), n - 1).map(c => [x, ...c]));
}
function maxWalk(hs) {
  let best = { ft: 0, mi: 0, min: 0 };
  combos(hs, 2).forEach(([a, b]) => { const w = walk(a, b); if (w.ft > best.ft) best = w; });
  return best;
}
const known = (hs, k) => hs.filter(h => h[k] != null);
const total = (hs, k) => known(hs, k).reduce((t, h) => t + h[k], 0);
const shortAddr = h => h.addr.replace(/ (St|Ave|Blvd)$/, "").replace(/^(\d+) S Long Beach$/, "$1 LBB");

// ── map
const street = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Map © Esri, HERE, Garmin, OpenStreetMap contributors" });
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Imagery © Esri" });
const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19 });
const satLabeled = L.layerGroup([sat, labels]);

const map = L.map("map", { layers: [satLabeled] });
const narrow = window.matchMedia("(max-width: 800px)").matches;
L.control.layers({ "Satellite": satLabeled, "Street map": street }, null, { collapsed: narrow }).addTo(map);
L.control.scale({ imperial: true, metric: false }).addTo(map);

const markers = {};
HOUSES.forEach(h => {
  const o = OPTIONS[h.option];
  const icon = L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 26],
    html: `<div class="pin${h.available === false ? " booked" : ""}" style="background:${o.hex}"><span>${h.option}</span></div>` });
  markers[h.id] = L.marker([h.lat, h.lng], { icon }).addTo(map)
    .bindTooltip(h.addr + (h.available === false ? " (booked)" : ""), { direction: "top", offset: [0, -24], className: "lbl" })
    .on("click", () => focusHouse(h.id));
});
POIS.forEach(p => {
  if (p.marker === false) return;
  const icon = L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
    html: `<div class="poi">${p.icon}</div>` });
  p.marker = L.marker([p.lat, p.lng], { icon, zIndexOffset: -100 }).addTo(map)
    .bindTooltip(p.name, { direction: "top", offset: [0, -12], className: "lbl" });
});
map.fitBounds(L.latLngBounds([...HOUSES, ...POIS].map(h => [h.lat, h.lng])).pad(0.1));
if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

// ── selection state: which houses are ticked in each group
const selected = Object.fromEntries(Object.keys(OPTIONS).map(k => [k, new Set()]));
const lines = L.layerGroup().addTo(map);

function drawLines() {
  lines.clearLayers();
  Object.entries(selected).forEach(([k, set]) => {
    const hs = [...set].map(id => byId[id]);
    combos(hs, 2).forEach(([a, b]) => {
      const w = walk(a, b);
      L.polyline(w.path, { color: "#fff", weight: 4, opacity: 0.95, dashArray: w.estimate ? "6 6" : null })
        .bindTooltip(`${shortAddr(a)} ↔ ${shortAddr(b)}: ${w.min} min walk`, { sticky: true, className: "walk" })
        .addTo(lines);
    });
  });
}

function focusHouse(id) {
  const h = byId[id];
  map.setView([h.lat, h.lng], Math.max(map.getZoom(), 17));
  markers[id].openTooltip();
  document.querySelectorAll(".house").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  const el = document.querySelector(`.house[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function focusGroup(k) {
  const hs = [...selected[k]].map(id => byId[id]);
  if (!hs.length) return;
  map.fitBounds(L.latLngBounds(hs.map(h => [h.lat, h.lng])).pad(hs.length > 1 ? 1.2 : 0.01), { maxZoom: 18 });
}

// ── side panel
function houseCard(h) {
  const booked = h.available === false;
  const links = [
    h.listing ? `<a href="${h.listing}" target="_blank" rel="noopener">Listing ↗</a>` : "",
    `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${h.addr}, ${h.town || "Beach Haven"}, NJ 08008`)}" target="_blank" rel="noopener">Google Maps ↗</a>`,
    `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${h.lat},${h.lng}" target="_blank" rel="noopener">Street View ↗</a>`,
  ].join("");
  return `<div class="house${booked ? " booked" : ""}" data-id="${h.id}">
    <label class="addr"><input type="checkbox" data-opt="${h.option}" data-id="${h.id}"${booked ? " disabled" : ""}>
      <span>${h.addr}</span>${booked ? ' <span class="avail-no">BOOKED</span>' : ""}</label>
    <dl class="facts">
      <dt>Bedrooms</dt><dd>${v(h.bedrooms)}${h.baths != null ? ` · ${h.baths} bath` : ""}</dd>
      <dt>Sleeps</dt><dd>${v(h.sleeps)}</dd>
      <dt>Aug 7–14</dt><dd>${availHtml(h.available)}</dd>
      <dt>Weekly</dt><dd>${v(h.price, money)}</dd>
      <dt>Amenities</dt><dd>${v(h.amenities)}</dd>
    </dl>
    ${h.notes ? `<div class="note">${h.notes}</div>` : ""}
    <div class="links">${links}</div>
    ${FEEDBACK_URL ? `<div class="fb" data-item="house:${h.id}"></div>` : ""}
  </div>`;
}

function summary(k) {
  const o = OPTIONS[k], hs = [...selected[k]].map(id => byId[id]);
  if (!hs.length) return `<div class="summary empty">Tick ${o.pick} houses above to total them up.</div>`;
  const count = hs.length === o.pick ? `${hs.length} of ${o.pick} picked`
              : `<span class="warn">${hs.length} picked; this option needs ${o.pick}</span>`;
  const stat = (k2, label, fmt = x => x) => {
    const miss = hs.length - known(hs, k2).length;
    return `<div class="stat"><b>${fmt(total(hs, k2))}${miss ? "+" : ""}</b><span>${label}${miss ? ` (${miss} TBD)` : ""}</span></div>`;
  };
  const pairs = combos(hs, 2).map(([a, b]) => {
    const w = walk(a, b);
    return `<tr><td>${shortAddr(a)} ↔ ${shortAddr(b)}</td><td class="num">${distLabel(w)}</td><td class="num">${walkLabel(w)}</td></tr>`;
  }).join("");
  const places = [...POIS.filter(p => p.for === k), ...POIS.filter(p => !p.for)];
  const poiRows = places.map((p, i) => `<tr${p.for && !places[i + 1]?.for ? ' class="split"' : ""}><td title="${p.name}">${p.icon} ${p.short}</td>${hs.map(h => {
    const w = walk(h, p);
    return `<td class="num route" data-a="${h.id}" data-b="${p.id}"><b>${distLabel(w)}</b><br><span class="sub">${walkLabel(w).split(" · ").join("<br>")}</span></td>`;
  }).join("")}</tr>`).join("");
  return `<div class="summary">
    <div class="count">${count} · <a href="#" data-focus="${k}">show on map</a></div>
    <div class="stats">${stat("bedrooms", "bedrooms")}${stat("sleeps", "sleeps")}${stat("price", "per week", money)}</div>
    ${pairs ? `<table><tr><th>Between houses</th><th class="num">Distance</th><th class="num">Time</th></tr>${pairs}</table>` : ""}
    <table class="poi-table"><tr><th>To</th>${hs.map(h => `<th class="num">${shortAddr(h)}</th>`).join("")}</tr>${poiRows}</table>
  </div>`;
}

function combosTable(k) {
  const o = OPTIONS[k];
  const hs = HOUSES.filter(h => h.option === k);
  if (hs.length <= o.pick) return "";
  const rows = combos(hs, o.pick).map(c => {
    const w = maxWalk(c), booked = c.some(h => h.available === false);
    const s = known(c, "sleeps").length === c.length ? total(c, "sleeps") : "–";
    const p = known(c, "price").length === c.length ? money(total(c, "price")) : "–";
    return `<tr class="pair${booked ? " booked" : ""}" data-opt="${k}" data-ids="${c.map(h => h.id).join(",")}">
      <td>${c.map(shortAddr).join(" + ")}</td><td class="num">${w.min} min</td><td class="num">${s}</td><td class="num">${p}</td></tr>`;
  }).join("");
  return `<details><summary>All ${o.pick === 2 ? "pairs" : "groups of " + o.pick} (click one to select it)</summary>
    <table><tr><th>Houses</th><th class="num">Walk*</th><th class="num">Sleeps</th><th class="num">Total</th></tr>${rows}</table></details>`;
}

const side = document.getElementById("side");
side.innerHTML =
  `<div id="fb-intro" class="fb-intro" hidden>
     <label>Your name <input id="fb-name" maxlength="40" placeholder="so votes & comments show who" autocomplete="given-name"></label>
     <div class="sub">Vote 👍 or comment on any option or house. <span id="fb-status" class="warn"></span></div>
   </div>` +
  (SUGGEST_URL ? `<a class="suggest" href="${SUGGEST_URL}" target="_blank" rel="noopener">
     <b>🏠 Know a house we should look at?</b>
     <span>Suggest a house or a set of houses near each other: address, link, price, whatever you know. Takes a minute.</span>
     <span class="go">Suggest a house ↗</span></a>` : "") +
  `<h2>Points of interest</h2><div class="pois">${POIS.filter(p => !p.for).map(p =>
    `<a href="#" data-poi="${p.id}">${p.icon} ${p.name}</a>`).join("")}</div>` +
  `<div class="jump">${Object.entries(OPTIONS).map(([k, o]) =>
    `<a href="#opt-${k}" style="background:${o.hex}">Option ${k}</a>`).join("")}</div>` +
  Object.entries(OPTIONS).map(([k, o]) => `<section data-opt="${k}" id="opt-${k}">
    <h2><span class="dot" style="background:${o.hex}"></span>${o.name}</h2>
    ${FEEDBACK_URL ? `<div class="fb fb-opt" data-item="option:${k}"></div>` : ""}
    ${HOUSES.filter(h => h.option === k).map(houseCard).join("")}
    <div id="sum-${k}"></div>
    ${combosTable(k)}
  </section>`).join("") +
  `<p class="note"><b>Availability:</b> lbi.vacations gives a price for Aug 7–14 on every house, but its calendars show no booked dates for any house, so it can’t confirm a week is open. Set <code>available</code> to true/false once an agency confirms. Prices are the base weekly rent before taxes and fees.</p>
   <p class="note">*Walk = the farthest two houses in the group. Distances and walk times follow real streets and public paths (OpenStreetMap walking routes), not a straight line. Hover or tap a distance in a group's table to draw that route on the map. Bike times follow bike-friendly streets. Drive times (🚗, shown for trips over ~1¼ mi) are no-traffic estimates; expect longer on an August weekend. House pins come from US Census address geocoding, so they can be off by a lot or two.</p>
   <p class="note ai-link">Separately, an A.I. searched rental listings for more groups of houses. Those results are unchecked: nobody has checked anything about these automatically-generated houses/groups, which may be terrible and/or inaccurate. <a href="ai/">See the A.I.'s unchecked results</a> (a separate page that also includes these picks).</p>`;

function refresh(k) {
  document.getElementById("sum-" + k).innerHTML = summary(k);
  document.querySelectorAll(`input[data-opt="${k}"]`).forEach(cb => cb.checked = selected[k].has(cb.dataset.id));
  drawLines();
}

// Hovering (or tapping) a distance cell draws that walking route in yellow
const poiRoute = L.layerGroup().addTo(map);
function showRoute(td, fit) {
  poiRoute.clearLayers();
  if (!td) return;
  const h = byId[td.dataset.a], p = POIS.find(x => x.id === td.dataset.b), w = walk(h, p);
  const line = L.polyline(w.path, { color: "#ffd23f", weight: 5, opacity: 0.95 })
    .bindTooltip(`${shortAddr(h)} → ${p.name}: ${w.min} min walk`, { sticky: true, className: "walk" }).addTo(poiRoute);
  if (fit) map.fitBounds(line.getBounds().pad(0.2));
}
side.addEventListener("mouseover", e => showRoute(e.target.closest("td.route"), false));
side.addEventListener("mouseleave", () => showRoute(null));

side.addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox]");
  if (!cb) return;
  const set = selected[cb.dataset.opt];
  cb.checked ? set.add(cb.dataset.id) : set.delete(cb.dataset.id);
  refresh(cb.dataset.opt);
});
side.addEventListener("click", e => {
  if (e.target.closest(".fb, .fb-intro")) return fbClick(e);
  const a = e.target.closest("a");
  if (a && a.getAttribute("href")?.startsWith("#opt-")) {
    e.preventDefault();
    const k = a.getAttribute("href").slice(5);
    document.getElementById("opt-" + k).scrollIntoView({ behavior: "smooth" });
    const hs = HOUSES.filter(h => h.option === k);
    return map.fitBounds(L.latLngBounds(hs.map(h => [h.lat, h.lng])).pad(0.5), { maxZoom: 18 });
  }
  if (a && a.dataset.focus) { e.preventDefault(); return focusGroup(a.dataset.focus); }
  if (a && a.dataset.poi) {
    e.preventDefault();
    const p = POIS.find(x => x.id === a.dataset.poi);
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 17));
    return p.marker.openTooltip();
  }
  if (a) return;
  const cell = e.target.closest("td.route");
  if (cell) return showRoute(cell, true);
  const row = e.target.closest("tr.pair");
  if (row) {
    const k = row.dataset.opt;
    selected[k] = new Set(row.dataset.ids.split(","));
    refresh(k);
    return focusGroup(k);
  }
  if (e.target.closest("label")) return;   // checkbox label handles itself
  const card = e.target.closest(".house");
  if (card) focusHouse(card.dataset.id);
});

// Start with every group pre-filled where the choice is forced (B), others empty
Object.keys(OPTIONS).forEach(k => {
  const hs = HOUSES.filter(h => h.option === k && h.available !== false);
  if (hs.length === OPTIONS[k].pick) hs.forEach(h => selected[k].add(h.id));
  refresh(k);
});

// ── votes & comments (Google Sheet + Apps Script backend; see apps-script/Code.gs)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
let fbData = { votes: [], comments: [] };
const fbOpen = new Set();
let fbError = "";

function myName() { return (document.getElementById("fb-name")?.value || "").trim(); }

function fbHtml(item) {
  const votes = fbData.votes.filter(v => v.item === item);
  const comments = fbData.comments.filter(c => c.item === item).sort((a, b) => a.ts - b.ts);
  const me = myName().toLowerCase();
  const mine = me && votes.some(v => v.name.toLowerCase() === me);
  const open = fbOpen.has(item);
  const fmt = ts => new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<div class="fb-bar">
      <button type="button" class="fb-vote${mine ? " on" : ""}" data-act="vote">👍 ${votes.length || ""}<span>${mine ? "Voted" : "Vote"}</span></button>
      <button type="button" class="fb-toggle" data-act="toggle">💬<span>${open ? "Cancel" : "Comment"}</span></button>
      ${votes.length ? `<span class="fb-who">${votes.map(v => esc(v.name)).join(", ")}</span>` : ""}
    </div>
    ${comments.length || open ? `<div class="fb-panel">
      ${comments.map(c => `<div class="fb-c"><b>${esc(c.name)}</b> <span class="sub">${fmt(c.ts)}</span><div>${esc(c.text)}</div></div>`).join("")}
      ${open ? `<textarea rows="2" maxlength="1000" placeholder="Add a comment…"></textarea>
      <button type="button" class="fb-post" data-act="post">Post</button>` : ""}
    </div>` : ""}`;
}

function renderFeedback() {
  if (!FEEDBACK_URL) return;
  document.querySelectorAll(".fb[data-item]").forEach(el => {
    const draft = el.querySelector("textarea")?.value || "";
    el.innerHTML = fbHtml(el.dataset.item);
    const ta = el.querySelector("textarea");
    if (ta) ta.value = draft;
  });
  const st = document.getElementById("fb-status");
  if (st) st.textContent = fbError;
}

async function fbCall(body) {
  try {
    const r = body
      ? await fetch(FEEDBACK_URL, { method: "POST", body: JSON.stringify(body) })   // text/plain: no CORS preflight
      : await fetch(FEEDBACK_URL);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "error");
    fbData = d; fbError = "";
  } catch (err) {
    fbError = "Couldn't reach the comments sheet. Try again in a minute.";
  }
  renderFeedback();
}

function needName() {
  if (myName()) return false;
  const inp = document.getElementById("fb-name");
  inp.classList.add("need"); inp.focus();
  inp.scrollIntoView({ behavior: "smooth", block: "center" });
  return true;
}

function fbClick(e) {
  const btn = e.target.closest("[data-act]");
  const box = e.target.closest(".fb[data-item]");
  if (!btn || !box) return;
  const item = box.dataset.item, act = btn.dataset.act;
  if (act === "toggle") {
    fbOpen.has(item) ? fbOpen.delete(item) : fbOpen.add(item);
    renderFeedback();
    return box.querySelector("textarea")?.focus();
  }
  if (needName()) return;
  if (act === "vote") {
    const me = myName().toLowerCase();
    const on = !fbData.votes.some(v => v.item === item && v.name.toLowerCase() === me);
    // optimistic update so the button responds instantly
    fbData.votes = on ? [...fbData.votes, { item, name: myName() }]
                      : fbData.votes.filter(v => !(v.item === item && v.name.toLowerCase() === me));
    renderFeedback();
    fbCall({ action: "vote", item, name: myName(), on });
  }
  if (act === "post") {
    const ta = box.querySelector("textarea"), text = ta.value.trim();
    if (!text) return ta.focus();
    ta.value = ""; btn.disabled = true;
    fbOpen.delete(item);
    fbCall({ action: "comment", item, name: myName(), text });
  }
}

if (FEEDBACK_URL) {
  document.getElementById("fb-intro").hidden = false;
  const inp = document.getElementById("fb-name");
  inp.value = store.get("lbi-name");
  inp.addEventListener("input", () => { inp.classList.remove("need"); store.set("lbi-name", inp.value.trim()); renderFeedback(); });
  renderFeedback();
  fbCall();
  setInterval(() => { if (!document.hidden) fbCall(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) fbCall(); });
}

</script>
</body>
</html>
